[workspace]
resolver = "3"
members = ["crates/quiver-core", "crates/quiver-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AnkushBL6/quiver"
authors = ["Quiver contributors"]
rust-version = "1.90"

[workspace.dependencies]
quiver-core = { path = "crates/quiver-core", version = "0.1.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
