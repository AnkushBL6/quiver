name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # Real signing + notarization only when the Apple secrets exist. Without them the app is
      # ad-hoc signed (tauri.conf "signingIdentity": "-"); empty secret vars would break the bundler.
      - name: Enable Apple signing if configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No Apple certificate: ad-hoc signing."; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then printf '%s<<QUIVER_EOF\n%s\nQUIVER_EOF\n' "$v" "${!v}" >> "$GITHUB_ENV"; fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Quiver ${{ github.ref_name }}
          releaseDraft: true
      - name: Build CLI (universal)
        run: |
          cargo build --release -p quiver-cli --target aarch64-apple-darwin
          cargo build --release -p quiver-cli --target x86_64-apple-darwin
          lipo -create -output quiver target/aarch64-apple-darwin/release/quiver target/x86_64-apple-darwin/release/quiver
          tar czf quiver-cli-macos-universal.tar.gz quiver
          gh release upload "${{ github.ref_name }}" quiver-cli-macos-universal.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    # Both jobs attach to the same draft release; the macOS job goes first so they
    # never race to create it. A failed macOS build doesn't block this one.
    needs: [macos]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # NSIS installer (Quiver_<version>_x64-setup.exe). Not code-signed: Windows
      # SmartScreen will warn on first run until the app has reputation or is signed.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: Quiver ${{ github.ref_name }}
          releaseDraft: true
      - name: Build CLI and upload stable-named assets
        shell: pwsh
        run: |
          cargo build --release -p quiver-cli
          Compress-Archive -Path target/release/quiver.exe -DestinationPath quiver-cli-windows-x64.zip
          # A version-less copy of the installer so https://github.com/<repo>/releases/latest/download/... keeps working.
          $setup = Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          Copy-Item $setup.FullName Quiver-windows-x64-setup.exe
          gh release upload "${{ github.ref_name }}" quiver-cli-windows-x64.zip Quiver-windows-x64-setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
