name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (core + CLI) · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QUIVER_NO_TRASH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps for keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy -p quiver-core -p quiver-cli --all-targets -- -D warnings
      - run: cargo test -p quiver-core -p quiver-cli
      # Run the built CLI against a throwaway USERPROFILE: create a skill, sync it
      # to two agents, break links on purpose, run doctor, check what is on disk.
      - name: CLI end-to-end (junction links, doctor, copy fallback)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p quiver-cli
          ./.github/scripts/windows-cli-e2e.ps1 -Quiver "$PWD/target/debug/quiver.exe"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  app:
    # Fast compile + lint check of the Tauri app. The full signed bundle is built by
    # build.yml (non-blocking) and release.yml, so pushes get a verdict in about a minute.
    name: App (compile check) · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! embeds ../dist at compile time; an empty dir is enough for a check.
      - run: mkdir -p app/dist
        shell: bash
      - run: cargo clippy -p quiver-app -- -D warnings
